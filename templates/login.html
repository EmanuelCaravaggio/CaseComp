<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect | Sign In</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="page">
        <div class="login-card">
            <div class="brand">
                <img src="{{ url_for('static', filename='logo_ops.png') }}" alt="Connect logo" class="brand-logo">
                
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <a href="{{ url_for('login_win') }}" class="win-button">
                <svg class="win-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="9" cy="8" r="4" fill="#2e7d32"/>
                    <path d="M2 22c0-5.5 4-8 7-8s7 2.5 7 8v2H2z" fill="#2e7d32"/>
                    <rect x="20" y="2" width="8" height="8" rx="1.5" fill="#1a3f8f"/>
                    <rect x="31" y="2" width="8" height="8" rx="1.5" fill="#1a3f8f"/>
                    <rect x="20" y="13" width="8" height="8" rx="1.5" fill="#1a3f8f"/>
                    <rect x="31" y="13" width="8" height="8" rx="1.5" fill="#1a3f8f"/>
                </svg>
                <span class="win-text">
                    <span class="win-title">Sign in with WIN</span>
                    <span class="win-status"><span class="status-dot"></span>Available</span>
                </span>
            </a>

            <div class="or-divider"><span>or</span></div>

            <button type="button" class="toggle-email-link" onclick="document.getElementById('email-form').classList.toggle('hidden'); this.classList.toggle('hidden')">
                Sign in with email
            </button>

            <form method="POST" action="{{ url_for('login') }}" id="email-form" class="hidden">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ email }}"
                    placeholder="you@ontario.ca"
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                >

                <button type="submit" class="email-submit">Sign In</button>
            </form>

            <div class="footer-links">
                <a href="#">Forgot password?</a>
                <span class="divider">·</span>
                <a href="#">Need an account?</a>
            </div>
        </div>
    </div>
</body>
</html>
